<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<title>AI Engineering Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a workbench. Left rail of tasks; three working columns (situation / levers / results) that stack on narrow screens. */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --fg:#1c2024; --muted:#5f6871; --line:#d9ddd8; --line-strong:#b9c0bb;
  --accent:#1f4e79; --accent-ink:#ffffff; --accent-soft:#e3ecf5;
  --ok:#1f7a4d; --ok-soft:#e1f2e8; --bad:#b4342a; --bad-soft:#f8e4e1; --warn:#9a6b00; --warn-soft:#f7edcf;
  --code:#f6f7f5; --font:'IBM Plex Sans', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif; --mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15181b; --panel:#1d2125; --fg:#e8eaec; --muted:#9aa3ab; --line:#2d3338; --line-strong:#434b52;
  --accent:#7fb0e0; --accent-ink:#0f1b26; --accent-soft:#1d2d3d; --ok:#5fc48f; --ok-soft:#163324; --bad:#f08a80; --bad-soft:#3a1f1c; --warn:#e2b85a; --warn-soft:#3a2f14; --code:#171a1d; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#15181b; --panel:#1d2125; --fg:#e8eaec; --muted:#9aa3ab; --line:#2d3338; --line-strong:#434b52;
  --accent:#7fb0e0; --accent-ink:#0f1b26; --accent-soft:#1d2d3d; --ok:#5fc48f; --ok-soft:#163324; --bad:#f08a80; --bad-soft:#3a1f1c; --warn:#e2b85a; --warn-soft:#3a2f14; --code:#171a1d; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.55;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea,input,select{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--r);padding:8px 10px}
textarea{width:100%;resize:vertical;font-family:var(--mono);font-size:12.5px;line-height:1.5;min-height:150px}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding:18px 0 14px;border-bottom:1px solid var(--line)}
.top h1{font-size:22px;font-weight:600;letter-spacing:-.01em}
.top .sub{color:var(--muted);margin-top:4px;max-width:60ch}
.top a{color:var(--accent);font-size:13px}
.keys{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.keys label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.keys input{min-width:230px;font-family:var(--mono);font-size:12.5px}
.keys .help{font-size:11.5px;color:var(--muted);max-width:30ch;text-transform:none;letter-spacing:0}
.wrap{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;padding-top:18px}
.rail{display:flex;flex-direction:column;gap:6px}
.rail h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 4px}
.tab{display:grid;grid-template-columns:22px 1fr;gap:8px;text-align:left;background:transparent;border:1px solid transparent;border-radius:var(--r);padding:9px 10px;color:var(--fg)}
.tab .f{font-size:11px;color:var(--muted);display:block}
.tab .i{font-size:15px;color:var(--accent);line-height:1.3}
.tab[aria-selected="true"]{background:var(--panel);border-color:var(--line-strong)}
.tab:hover{border-color:var(--line)}
.cols{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr) minmax(0,1.2fr);gap:16px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px}
.panel h3{font-size:15px;font-weight:600;margin-bottom:8px}
.scen p{margin:0 0 10px}
.failbox{border-left:3px solid var(--warn);background:var(--warn-soft);padding:8px 10px;border-radius:0 var(--r) var(--r) 0;font-size:13px;margin-top:10px}
details{border:1px solid var(--line);border-radius:var(--r);margin-top:8px}
details summary{cursor:pointer;padding:7px 10px;font-weight:500;font-size:13px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details summary::after{content:"+";color:var(--muted)}
details[open] summary::after{content:"–"}
details pre{margin:0;padding:10px;border-top:1px solid var(--line);font-family:var(--mono);font-size:12px;white-space:pre-wrap;word-break:break-word;background:var(--code);max-height:320px;overflow:auto}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line-strong);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lever{margin-bottom:14px}
.lever h3{font-size:13px;font-weight:600;margin-bottom:6px}
.opt{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:start;padding:7px 8px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:6px}
.opt input{margin:3px 0 0;width:auto;padding:0}
.opt .d{font-size:12px;color:var(--muted);margin-top:2px}
.opt.always{opacity:.75}
.opt .tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-left:6px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:8px 14px;font-weight:600}
.btn.sec{background:transparent;color:var(--accent)}
.btn[disabled]{opacity:.55;cursor:default}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}
.out{min-height:120px}
.out .box{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--code);white-space:pre-wrap;word-break:break-word;font-size:13.5px;line-height:1.6;max-height:520px;overflow:auto}
.out .box table{border-collapse:collapse;width:100%;font-size:12.5px;margin:4px 0}
.out .box th,.out .box td{border:1px solid var(--line-strong);padding:4px 6px;text-align:left;vertical-align:top}
.out .box th{background:var(--panel)}
.twin{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.twin .lab{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 4px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion: reduce){.dot{animation:none}}
.trace{margin-top:12px}
.trace ol{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.trace li{border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;font-size:12.5px}
.trace li .k{font-family:var(--mono);font-size:11px;color:var(--muted);display:block;margin-bottom:2px}
.trace li.ok{border-left:3px solid var(--ok)} .trace li.bad{border-left:3px solid var(--bad)} .trace li.tool{border-left:3px solid var(--accent)} .trace li.err{border-left:3px solid var(--bad);background:var(--bad-soft)}
.trace pre{margin:4px 0 0;font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;word-break:break-word;max-height:200px;overflow:auto;background:var(--code);padding:6px;border-radius:4px}
.mark-ok{background:var(--ok-soft);border-bottom:2px solid var(--ok);border-radius:2px;padding:0 2px}
.mark-bad{background:var(--bad-soft);border-bottom:2px solid var(--bad);border-radius:2px;padding:0 2px}
.why{border-top:1px dashed var(--line-strong);margin-top:14px;padding-top:10px;font-size:13px}
.why b{color:var(--accent)}
.meta{font-size:11.5px;color:var(--muted);font-family:var(--mono);margin-top:6px}
.foot{color:var(--muted);font-size:12.5px;margin-top:22px;border-top:1px solid var(--line);padding-top:10px}
@media (max-width:1100px){.cols{grid-template-columns:1fr 1fr}.cols .res{grid-column:1/-1}}
@media (max-width:820px){.wrap{grid-template-columns:1fr}.rail{flex-direction:row;flex-wrap:wrap}.rail h2{width:100%}.tab{flex:1 1 45%}.cols{grid-template-columns:1fr}.twin{grid-template-columns:1fr}}
</style>

</head>

<script>
const UI = {"title": "AI Engineering Lab", "subtitle": "Compare prompt, context, and harness engineering step by step on the same business task.", "other_lang": "한국어 버전", "apikey": "API key", "apikey_ph": "sk-ant-...", "apikey_help": "Enter the key handed out by the instructor. It is stored only in this browser.", "model": "Model", "tasks": "Tasks", "scenario": "Scenario", "materials": "View materials", "levers": "Levers", "prompt": "① Prompt", "context": "② Context (materials sent along with the prompt)", "harness": "③ Harness (machinery outside the model)", "presets": "Presets", "L0": "Level 0 · Just ask", "L1": "Level 1 · Prompt", "L2": "Level 2 · +Context", "L3": "Level 3 · +Harness", "run": "Run", "compare": "Run against Level 0", "running": "Running…", "output": "Output", "trace": "Trace", "naive_out": "Level 0 output (just ask)", "your_out": "Your configuration", "why": "Why this happened", "no_key": "Enter an API key first.", "err": "Error", "calls": "calls", "tokens": "tokens", "attached": "attached", "detached": "not attached", "pass": "pass", "fail": "fail", "retry": "retry", "verified": "verified", "unverified": "unverified", "tool_call": "tool call", "tool_result": "tool result", "score": "score", "musthave": "must-haves", "candidate": "Candidate", "blind": "blinded", "footer": "Outputs vary from call to call. Run the same configuration twice to see the variance as well.", "level_note": {"L0": "No materials, no instructions. The model fills the blanks plausibly.", "L1": "Role, constraints, and output format are specified. Tone and structure improve, but the model still does not know what it was never told.", "L2": "The materials the model needs are supplied. It can now be grounded, but nobody checks whether it was.", "L3": "Checking, calculation, and decomposition happen outside the model. When the model is wrong, the system catches it."}};
const TASKS = [{"id": "cs", "icon": "◔", "title": "Customer Service — Reply to a Refused-Refund Customer", "func": "Customer relations", "scenario": "An angry customer demands a refund and a compensation coupon and threatens to post reviews. You are the agent, and you want the AI to draft the reply.", "fail": "Without the policy, the model placates the customer by promising a refund or coupon, or by admitting company fault. All three are prohibited.", "materials": [{"id": "email", "label": "Customer email", "text": "Subject: You're refusing my refund? Seriously?\n\nI'm writing about order A2026-11873. I bought the NC-700 noise-cancelling headphones on October 7. Your website clearly said \"30-day no-questions refund\", yet your call center tells me a refund is not possible. Yes, I used them a few times, but I'm not satisfied, so why can't I return them?\nI want a full refund and a compensation coupon for the trouble. If I don't hear back today, I will post about this on every community and review site I can find.\n— J. Park (today's date: November 17)", "always": true}, {"id": "policy", "label": "Refund policy v4.2", "text": "[Returns & Refunds Policy v4.2 — agent reference]\n1. Unopened items: full refund within 14 days of delivery.\n2. Opened or used items: no refund. Exchange for the same model only if an initial defect is confirmed within 30 days of delivery.\n3. After 30 days: only manufacturer-warranty (1 year) repair guidance, paid or free as applicable.\n4. Agents may not grant coupons, points, or any monetary compensation on their own. If compensation seems warranted, escalate as \"Team lead review\".\n5. Apologies must not admit company fault (\"our mistake\", \"our website misinformed you\"). Claims about website wording are handled as \"we will verify and follow up\".\n6. Do not negotiate or set conditions in response to threats of reviews or posts."}, {"id": "order", "label": "Order lookup", "text": "[Order lookup A2026-11873]\n- Customer: J. Park (tier: standard)\n- Item: NC-700 headphones, paid 349,000 KRW\n- Ordered Oct 7 / delivered Oct 9 (as of today, Nov 17: 39 days since delivery)\n- Opened: yes, signs of use (per customer)\n- Defect reports: none\n- Refunds in last 12 months: 2 (both unopened returns)\n- Website wording check: currently states \"14-day refund, unopened\". The \"30-day no-questions refund\" was a 2025 campaign that has ended."}], "prompts": {"L0": "Write a reply to the customer email below.", "L1": "You are a customer-service agent for an online electronics store. Write a reply to the customer email below.\n\nRules:\n- Polite but firm. No excessive apology.\n- Do not promise anything the company may not provide under policy (refund, coupon, compensation). If unsure, do not promise; say you will verify and follow up.\n- Do not admit company fault.\n- Do not react to the threat of posting reviews.\n- Offer one or two concrete next steps the customer can actually take.\n\nFormat: greeting → two-sentence summary of the situation → guidance → next steps → closing. Under 150 words."}, "harness": [{"id": "checker", "label": "Policy-compliance checker + auto-retry", "desc": "A second model call checks the draft against the policy and returns violations as JSON; if any, the draft is regenerated with the violation list (up to 2 retries)."}], "why": {"L0": "The model does not know the policy, so it writes the answer that satisfies the customer. Look for promised refunds or coupons, or admissions such as \"our website misinformed you\".", "L1": "Tone and structure improve. But without the 39-day and opened facts, the model drifts into generic statements or still hedges toward a promise.", "L2": "With policy and order data the reply is usually right. Occasionally it still 'offers to look into' a coupon or concedes the website wording. Nobody knows until a human reads it.", "L3": "The checker catches violations and forces a rewrite. Compare the first draft's violations with the retry in the trace. The system verifies instead of trusting the model."}}, {"id": "board", "icon": "▤", "title": "Board Reporting — Five-Bullet Quarterly Summary", "func": "Finance / planning", "scenario": "The CFO wants five bullets on Q3 results for tomorrow's board meeting. You have the Q3 sheet; the comparison figures are in a separate finance-team file.", "fail": "The Q3 sheet contains no prior-quarter figures. Asked to include quarter-over-quarter changes, the model invents them.", "materials": [{"id": "q3", "label": "Q3 results summary", "text": "[Hanbit Electronics — Q3 2026 Results Summary, internal]\n■ Consolidated P&L (KRW 100 million)\n  Revenue 1,284 / COGS 962 / Gross profit 322 / SG&A 225 / Operating profit 97 (operating margin 7.6%) / Net profit 61\n■ Revenue by division (KRW 100 million)\n  Home appliances 612 / Industrial sensors 418 / Automotive components 254\n■ Revenue by region\n  Korea 47% / North America 29% / Europe 15% / Other 9%\n■ Financial indicators\n  Inventory days 71 / Receivable days 54 / Cash and equivalents 50.3 billion KRW / Net debt 38.8 billion KRW\n■ Notable items this quarter\n  - Industrial sensors: two new European factory-automation customers won (about 6.0 billion KRW per year)\n  - Automotive components: a key customer's model is being discontinued; monthly revenue expected to fall by about 0.8 billion KRW from October\n  - FX: quarterly average 1,398 KRW/USD\n※ Prior-quarter and year-over-year comparisons: see separate finance-team materials.", "always": true}, {"id": "q2", "label": "Finance comparison figures (prior quarter, prior year, budget)", "text": "[Finance team — comparison figures, KRW 100 million]\n                    Q2 2026    Q3 2025    2026 budget (quarterly avg.)\nRevenue              1,219      1,142      1,250\nOperating profit        88         74         90\nOperating margin       7.2%       6.5%       7.2%\nHome appliances        598        577        600\nIndustrial sensors     372        318        380\nAutomotive comps       249        247        270\nInventory days          66         63         65\nNet debt               421        455          —"}], "prompts": {"L0": "Summarize the quarterly report below in five bullets for the board. Include the quarter-over-quarter change (%) in each bullet and name the single biggest risk.", "L1": "You write board materials for a listed company's planning team. Using the materials below, write a five-bullet summary for the board.\n\nRules:\n- Use only numbers that appear in the materials. Do not invent comparisons (quarter-over-quarter, year-over-year); if the data is absent, write 'no comparison data'.\n- For any number you compute, show the basis in parentheses as '(calc: A/B)'.\n- One sentence per bullet; state units.\n- The last bullet is the key risk and its evidence.\n- Mark interpretation with 'Interpretation:' to separate it from fact."}, "harness": [{"id": "verifier", "label": "Number-provenance verifier + retry", "desc": "Code extracts every number in the output and checks it against the attached materials. A computed value passes if every number in its '(calc: …)' basis is in the materials. Unverified numbers are listed and the summary is regenerated."}], "why": {"L0": "Quarter-over-quarter figures are not in the sheet, so the model fabricates them (\"up 4.2% QoQ\") or hedges. Try to find each number in the source.", "L1": "The 'do not invent' rule reduces fabrication, but with no comparison data the summary is thin. This is the limit of what instructions alone can do.", "L2": "With comparison figures the summary becomes substantive. But a wrong percentage or a budget/prior-year mix-up looks exactly as plausible as a right one.", "L3": "The verifier marks every number as verified or not. Watch how unverified numbers change on retry. The more numbers a report has, the more this replaces human checking."}}, {"id": "hr", "icon": "◫", "title": "Hiring — Screen Five Résumés", "func": "HR", "scenario": "Five résumés arrived for a data-analytics team-lead position. The recruiter wants the AI to do a first screen.", "fail": "Asked to pick 'the best candidate' without the posting, the model gravitates to the flashiest résumé (A: 'AI strategy leader') or the highest degree (D: PhD). Neither meets the must-haves (5 years SQL, people management). Name, age, and gender cues are also exposed.", "materials": [{"id": "resumes", "label": "Five résumés", "text": "[Candidate A]\nName: Taeyoon Kim | Age: 38 | Gender: M\n[Summary] AI & data strategy leader. Drove data-based innovation at a global consultancy and a startup. Designed company-wide AI strategy and digital-transformation roadmaps. Internal 'Innovator of the Year' 2024.\n[Experience] Next Consulting, AI Strategy Manager 2021–present: AI adoption roadmaps for clients, data-governance framework proposals, executive workshops. / Fintech startup, Growth Analyst 2019–2021: funnel analysis in SQL/Python, marketing dashboards.\n[Skills] SQL (about 2 years hands-on), Python, Tableau, GPT strategy, presentations\n[Management] Many project-based collaborations. No direct reports.\n[Education] BBA, Seoul-based university\n\n[Candidate B]\nName: Sujin Lee | Age: 41 | Gender: F\n[Summary] 7 years of retail data analysis. Store demand forecasting and promotion-effect analysis.\n[Experience] Hanmart, Data Analytics Part Lead 2022–present (manages 3 analysts, monthly reporting to division head) / same company, Senior Analyst 2019–2022 / Retail SI vendor, BI developer 2017–2019\n[Skills] SQL (7 years), Python, Power BI operations (40 company-wide dashboards), A/B test design\n[Languages] Korean native, English intermediate\n[Education] BS Statistics\n\n[Candidate C]\nName: Daniel Okafor | Age: 36 | Gender: M\n[Summary] 6 years of data analysis at commerce platforms. 8 years in Korea.\n[Experience] Global e-commerce, Korea entity, Analytics Lead 2023–present: manages 2 analysts, weekly KPI reporting to Korean executives (in Korean) / same company, Senior Analyst 2020–2023 / Logistics startup, Data Analyst 2019–2020\n[Skills] SQL (6 years), BigQuery, Looker, experiment design\n[Languages] Korean business level (TOPIK 6), English native\n[Education] BS Computer Science\n\n[Candidate D]\nName: Minho Jung | Age: 34 | Gender: M\n[Summary] PhD in Statistics. Causal inference and experiment design. Five journal publications.\n[Experience] University research institute, Researcher 2022–present: policy-effect analysis, R/Python modeling / two corporate data projects during PhD\n[Skills] R, Python, SQL (about 4 years, research use), Bayesian statistics\n[Management] Supervised research assistants. No corporate team management.\n[Education] PhD Statistics\n\n[Candidate E]\nName: Jiwoo Han | Age: 39 | Gender: F\n[Summary] 5 years of manufacturing quality-data analysis; team lead for the past year.\n[Experience] Auto-parts maker, Quality Data Team Lead 2025–present (2 reports) / same company, Data Analyst 2020–2025\n[Skills] SQL (5 years), Python, Spotfire, SPC (statistical process control)\n[Languages] Korean native\n[Education] BS Industrial Engineering", "always": true}, {"id": "posting", "label": "Job posting (must-haves / nice-to-haves)", "text": "[Job Posting — Data Analytics Team Lead (Retail Division)]\nRole: build the analytics framework for store and online sales data, manage a team of 4 analysts, monthly reporting to division executives.\nMust-haves (all required):\n  (1) 5+ years of hands-on SQL-based data analysis\n  (2) 1+ year managing people as lead or manager of an analytics team\n  (3) Business-level Korean (executive reporting and cross-functional work)\nNice-to-haves: retail/commerce experience, BI dashboard operations, statistics or experiment-design knowledge.\nEvaluation principle: candidates missing any must-have are rejected regardless of nice-to-haves. Name, age, gender, and school are not evaluated."}, {"id": "rubric", "label": "Interviewer scoring guide", "text": "[Interviewer scoring guide]\nStage 1 gate: judge each const LANG = "en";
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = { get(k){ try{return localStorage.getItem(k)}catch(e){return null} }, set(k,v){ try{localStorage.setItem(k,v)}catch(e){} } };

// ---------- API ----------
async function callModel({system, messages, tools, max_tokens=1800, trace}) {
  const key = $('#apikey').value.trim(); if (!key) throw new Error(UI.no_key);
  const body = { model: $('#model').value, max_tokens, messages };
  if (system) body.system = system; if (tools) body.tools = tools;
  const r = await fetch('https://api.anthropic.com/v1/messages', { method:'POST',
    headers: {'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error((j.error && j.error.message) || ('HTTP '+r.status));
  if (trace) trace.calls = (trace.calls||0)+1, trace.tokens = (trace.tokens||0) + (j.usage ? j.usage.input_tokens + j.usage.output_tokens : 0);
  return j;
}
const textOf = j => (j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
function parseJSON(s){ const m = s.match(/\{[\s\S]*\}|\[[\s\S]*\]/); if(!m) throw new Error('no JSON'); return JSON.parse(m[0]); }

// ---------- state ----------
const state = {}; // taskId -> {prompt, ctx:Set, harness:Set, preset}
function initState(t){ if(!state[t.id]) state[t.id] = { prompt: t.prompts.L0, ctx:new Set(t.materials.filter(m=>m.always).map(m=>m.id)), harness:new Set(), preset:'L0' }; return state[t.id]; }
function applyPreset(t, L){ const s=initState(t); s.preset=L;
  s.prompt = L==='L0' ? t.prompts.L0 : t.prompts.L1;
  s.ctx = new Set(t.materials.filter(m=>m.always || (L==='L2'||L==='L3')).map(m=>m.id));
  s.harness = new Set(L==='L3' ? t.harness.map(h=>h.id) : []); }
function configOf(t){ const s=initState(t); return { prompt:s.prompt, ctx:[...s.ctx], harness:[...s.harness] }; }
function naiveConfig(t){ return { prompt:t.prompts.L0, ctx:t.materials.filter(m=>m.always).map(m=>m.id), harness:[] }; }

  m.querySelectorAll('[data-ctx]').forEach(c=>c.onchange=e=>{ e.target.checked ? s.ctx.add(e.target.dataset.ctx) : s.ctx.delete(e.target.dataset.ctx); markCustom(); });
  m.querySelectorAll('[data-h]').forEach(c=>c.onchange=e=>{ e.target.checked ? s.harness.add(e.target.dataset.h) : s.harness.delete(e.target.dataset.h); markCustom(); });
  function markCustom(){ s.preset='custom'; m.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed','false')); $('#levelnote').textContent=''; }
  $('#run').onclick = () => runTask(t, false);

function renderWhy(t){ const s=initState(t); const L = s.preset==='custom' ? guessLevel(t) : s.preset;
  $('#why').innerHTML = `<b>${UI.why} · ${UI[L]}</b><div>${esc(t.why[L])}</div>`; }
function guessLevel(t){ const s=initState(t); if(s.harness.size) return 'L3'; if([...s.ctx].some(id=>!t.materials.find(m=>m.id===id).always)) return 'L2'; if(s.prompt!==t.prompts.L0) return 'L1'; return 'L0'; }

async function runTask(t, compare){
  const out = $('#out'); const btns=[$('#run'),$('#cmp')]; btns.forEach(b=>b.disabled=true);
  const slot = (lab) => `<div><p class="lab">${lab}</p><div class="box"><span class="status"><span class="dot"></span>${UI.running}</span></div><div class="trace"></div><div class="meta"></div></div>`;
  out.innerHTML = compare ? `<div class="twin">${slot(UI.naive_out)}${slot(UI.your_out)}</div>` : slot(UI.your_out);
  const slots = out.querySelectorAll('.twin > div, .out > div');
  const jobs = compare ? [[naiveConfig(t), slots[0]], [configOf(t), slots[1]]] : [[configOf(t), slots[0]]];
  await Promise.all(jobs.map(async ([cfg, el]) => {
    const trace = { steps:[], calls:0, tokens:0 };
    try { const res = await RUNNERS[t.id](t, cfg, trace); el.querySelector('.box').innerHTML = res.html || esc(res.text); }
    catch(e){ trace.steps.push({cls:'err', k:UI.err, text:e.message}); el.querySelector('.box').innerHTML = `<span style="color:var(--bad)">${esc(e.message)}</span>`; }
    el.querySelector('.trace').innerHTML = `<ol>${trace.steps.map(st=>`<li class="${st.cls||''}"><span class="k">${esc(st.k)}</span>${esc(st.text||'')}${st.pre?`<pre>${esc(st.pre)}</pre>`:''}</li>`).join('')}</ol>`;
    el.querySelector('.meta').textContent = `${trace.calls} ${UI.calls} · ${trace.tokens.toLocaleString()} ${UI.tokens}`;
  }));
  btns.forEach(b=>b.disabled=false); renderWhy(t);
}

// ---------- shared helpers ----------
function buildUser(t, cfg, transform){
  const parts = t.materials.filter(m=>cfg.ctx.includes(m.id)).map(m=>`<${m.id}>\n${transform?transform(m):m.text}\n</${m.id}>`);
  return cfg.prompt + '\n\n' + parts.join('\n\n');
}
function fmtKR(n){ return n.toLocaleString(); }

// ---------- runners ----------
const RUNNERS = {};

// Task 1: customer service — LLM policy checker + retry
RUNNERS.cs = async (t, cfg, trace) => {
  const policy = t.materials.find(m=>m.id==='policy').text;
  let feedback = '', draft = '';
  const tries = cfg.harness.includes('checker') ? 3 : 1;
  for (let i=0;i<tries;i++){
    const user = buildUser(t,cfg) + (feedback ? `\n\n${LANG==='ko'?'이전 초안이 정책 검사에서 다음 위반으로 반려되었습니다. 위반을 모두 해소해 다시 작성하세요:':'The previous draft failed the policy check with these violations. Rewrite and resolve all of them:'}\n${feedback}` : '');
    const j = await callModel({messages:[{role:'user',content:user}], trace}); draft = textOf(j);
    trace.steps.push({k:`${LANG==='ko'?'초안':'draft'} #${i+1}`, text: draft.slice(0,160)+(draft.length>160?'…':'')});
    if (!cfg.harness.includes('checker')) break;
    const chk = await callModel({ max_tokens:600, trace, system: LANG==='ko'
      ? '당신은 고객센터 품질관리 검사기입니다. 주어진 정책과 답장 초안을 대조해 JSON만 출력하세요: {"pass": true|false, "violations": ["위반 항목 번호와 근거 문장"]}. 정책이 금지한 약속(환불·교환·쿠폰·보상), 과실 인정 표현, 위협에 대한 협상, 정책과 다른 기간 안내를 모두 위반으로 봅니다. 애매하면 위반으로 판정합니다.'
      : 'You are a customer-service QA checker. Compare the policy with the draft reply and output JSON only: {"pass": true|false, "violations": ["policy item number and the offending sentence"]}. Promises the policy forbids (refund, exchange, coupon, compensation), admissions of fault, negotiating with threats, and incorrect time windows all count as violations. When in doubt, flag it.',
      messages:[{role:'user',content:`<policy>\n${policy}\n</policy>\n<draft>\n${draft}\n</draft>`}] });
    let v; try { v = parseJSON(textOf(chk)); } catch(e){ v = {pass:false, violations:['checker returned non-JSON: '+textOf(chk).slice(0,120)]}; }
    if (v.pass) { trace.steps.push({cls:'ok', k:`${LANG==='ko'?'정책 검사':'policy check'} #${i+1} · ${UI.pass}`, text:''}); break; }
    feedback = (v.violations||[]).map(x=>'- '+x).join('\n');
    trace.steps.push({cls:'bad', k:`${LANG==='ko'?'정책 검사':'policy check'} #${i+1} · ${UI.fail}`, pre:feedback});
    if (i===tries-1) trace.steps.push({cls:'bad', k:LANG==='ko'?'재시도 한도 도달':'retry limit reached', text: LANG==='ko'?'사람 검토로 이관':'escalated to human review'});
  }
  return { text: draft };
};

// Task 2: board summary — deterministic number verifier
function numsIn(s){ const out=new Set(); (s.match(/\d[\d,]*\.?\d*/g)||[]).forEach(x=>{ const n=x.replace(/,/g,'').replace(/\.$/,''); if(/^\d+(\.\d+)?$/.test(n)) out.add(n); }); return out; }
function trivial(n){ const v=parseFloat(n); return (v>=2020&&v<=2030) || (Number.isInteger(v) && v<=12 && !n.includes('.')); }
function verifyNumbers(text, sources){
  const src = numsIn(sources);
  const lines = text.split('\n'); const flagged=[]; let html='';
  for (const line of lines){
    const calc = line.match(/\((?:계산|calc)[:：]([^)]*)\)/i);
    let calcOK = false; if (calc){ const cn=[...numsIn(calc[1])].filter(n=>!trivial(n)); calcOK = cn.length>0 && cn.every(n=>src.has(n)); }
    html += esc(line).replace(/\d[\d,]*\.?\d*/g, m=>{ const n=m.replace(/,/g,'').replace(/\.$/,''); if(!/^\d+(\.\d+)?$/.test(n)||trivial(n)) return m;
      const ok = src.has(n) || calcOK; if(!ok) flagged.push(m); return `<span class="${ok?'mark-ok':'mark-bad'}" title="${ok?UI.verified:UI.unverified}">${m}</span>`; }) + '\n';
  }
  return { html, flagged:[...new Set(flagged)] };
}
RUNNERS.board = async (t, cfg, trace) => {
  const sources = t.materials.filter(m=>cfg.ctx.includes(m.id)).map(m=>m.text).join('\n');
  const verify = cfg.harness.includes('verifier'); let text='', res=null, fb='';
  for (let i=0;i<(verify?2:1);i++){
    const user = buildUser(t,cfg) + (fb ? `\n\n${LANG==='ko'?'다음 숫자는 제공된 자료에서 확인되지 않았습니다. 자료에 있는 숫자만 쓰거나, 계산값이면 "(계산: A/B)" 형식으로 자료의 숫자로 근거를 남기고, 근거를 댈 수 없으면 삭제하세요:':'The following numbers could not be verified against the materials. Use only numbers in the materials, or, for computed values, show the basis as "(calc: A/B)" using numbers from the materials; otherwise remove them:'} ${fb}` : '');
    const j = await callModel({messages:[{role:'user',content:user}], trace}); text = textOf(j);
    if (!verify){ return { text }; }
    res = verifyNumbers(text, sources);
    const n = [...numsIn(text)].filter(x=>!trivial(x)).length;
    trace.steps.push({cls: res.flagged.length?'bad':'ok', k:`${LANG==='ko'?'숫자 검증':'number check'} #${i+1} · ${n-res.flagged.length}/${n} ${UI.verified}`, text: res.flagged.length ? `${UI.unverified}: ${res.flagged.join(', ')}` : ''});
    if (!res.flagged.length) break; fb = res.flagged.join(', ');
  }
  return { html: res.html };
};

function blind(text){ return text.replace(/^(이름|Name)[:：].*$/gmi, m => (LANG==='ko'?'이름: [삭제] | 나이: [삭제] | 성별: [삭제]':'Name: [redacted] | Age: [redacted] | Gender: [redacted]')); }

  const refs = t.materials.filter(m=>cfg.ctx.includes(m.id) && m.id!=='resumes').map(m=>`<${m.id}>\n${m.text}\n</${m.id}>`).join('\n\n');
  const sys = LANG==='ko'
    ? '당신은 채용 스크리닝 채점기입니다. 한 명의 후보만 평가합니다. 다른 후보와 비교하지 마세요. 제공된 공고와 채점 기준(있는 경우)에 따라 JSON만 출력하세요: {"m1":true|false,"m2":true|false,"m3":true|false,"qualified":true|false,"score":0-10,"evidence":"한 줄 근거"}. 공고가 없으면 필수요건을 SQL 5년·팀관리 1년·비즈니스 한국어로 가정하세요. 직함·수식어가 아닌 구체적 기간과 수행 내용으로 판단합니다. 부적격이면 score는 0.'
    : 'You are a hiring-screen scorer. Evaluate exactly one candidate; do not compare with others. Following the posting and rubric (if provided), output JSON only: {"m1":true|false,"m2":true|false,"m3":true|false,"qualified":true|false,"score":0-10,"evidence":"one line"}. If no posting is given, assume must-haves of 5 years SQL, 1 year people management, business Korean. Judge by concrete durations and duties, not titles. If not qualified, score is 0.';
  const results = await Promise.all(t.resumes.map(async (r,i)=>{
    const j = await callModel({max_tokens:400, trace, system:sys, messages:[{role:'user',content:`${refs}\n\n<candidate id="${t.labels[i]}">\n${doBlind?blind(r):r}\n</candidate>\n\n${cfg.prompt}`}]});
    let v; try{ v=parseJSON(textOf(j)); }catch(e){ v={m1:null,m2:null,m3:null,qualified:false,score:0,evidence:'non-JSON: '+textOf(j).slice(0,80)}; }
    trace.steps.push({cls: v.qualified?'ok':'bad', k:`${UI.candidate} ${t.labels[i]} · ${UI.score} ${v.score}`, text:v.evidence});
    return {id:t.labels[i], ...v};
  }));
  results.sort((a,b)=> (b.qualified-a.qualified) || (b.score-a.score));
  const yn = v => v===true?'✓':v===false?'✗':'?';
  const html = `<table><tr><th>${UI.candidate}</th><th>${UI.musthave} 1·2·3</th><th>${LANG==='ko'?'적격':'Qualified'}</th><th>${UI.score}</th><th>${LANG==='ko'?'근거':'Evidence'}</th></tr>` +
    results.map(r=>`<tr><td>${r.id}</td><td>${yn(r.m1)} ${yn(r.m2)} ${yn(r.m3)}</td><td>${r.qualified?'✓':'✗'}</td><td>${r.score}</td><td>${esc(r.evidence||'')}</td></tr>`).join('') + '</table>' +
    `<div class="note">${LANG==='ko'?'집계는 코드가 수행했습니다. 모델은 후보를 서로 비교하지 않았습니다.':'Aggregation was done by code. The model never compared candidates with each other.'}</div>`;
  return { html };
};

// Task 4: SCM — calculator tool + structured output
function safeCalc(expr){ const e = String(expr).replace(/,/g,'').replace(/×/g,'*').replace(/÷/g,'/').replace(/\^/g,'**'); if(!/^[\d\s+\-*/().%e]+$/i.test(e)) throw new Error('invalid expression'); const v = Function('"use strict";return ('+e+')')(); if(!isFinite(v)) throw new Error('not finite'); return v; }
RUNNERS.scm = async (t, cfg, trace) => {
  const useCalc = cfg.harness.includes('calc'), useSchema = cfg.harness.includes('schema');
  const tools = useCalc ? [{name:'calculate', description: LANG==='ko'?'산술식을 정확히 계산합니다. 곱셈·나눗셈·백분율 등 모든 계산에 반드시 이 도구를 사용하세요. 예: "3120 - 7*260"':'Evaluates an arithmetic expression exactly. Use it for every multiplication, division, or percentage. Example: "3120 - 7*260"', input_schema:{type:'object',properties:{expression:{type:'string'},label:{type:'string',description:'what this computes'}},required:['expression']}}] : undefined;
  let sys = LANG==='ko' ? '당신은 제조사 구매팀장을 돕는 분석가입니다.' : 'You are an analyst supporting a manufacturer\'s procurement lead.';
  if (useCalc) sys += LANG==='ko' ? ' 숫자 계산은 절대 직접 하지 말고 calculate 도구를 사용하세요. 도구 결과만 답에 인용하세요.' : ' Never do arithmetic yourself; use the calculate tool and quote only its results.';
  if (useSchema) sys += LANG==='ko' ? ' 최종 답은 아래 JSON 스키마로만 출력하세요 (다른 텍스트 금지): {"alternatives":[{"name":"A|B|C","shortfall_units":number,"cost_items":[{"item":string,"formula":string,"amount":number}],"total_cost":number,"customer_delivery":"기한 내|지연 N일","risk":string}],"recommendation":"A|B|C","reasons":[string,string,string],"reply_to_supplier":string,"assumptions":[string]}'
                        : ' Output the final answer only as this JSON schema (no other text): {"alternatives":[{"name":"A|B|C","shortfall_units":number,"cost_items":[{"item":string,"formula":string,"amount":number}],"total_cost":number,"customer_delivery":"on time|late N days","risk":string}],"recommendation":"A|B|C","reasons":[string,string,string],"reply_to_supplier":string,"assumptions":[string]}';
  const messages = [{role:'user',content:buildUser(t,cfg)}];
  let j, final='';
  for (let step=0; step<14; step++){
    j = await callModel({system:sys, messages, tools, max_tokens:2500, trace});
    const uses = (j.content||[]).filter(b=>b.type==='tool_use');
    if (!uses.length || j.stop_reason!=='tool_use'){ final = textOf(j); break; }
    messages.push({role:'assistant', content:j.content});
    const results = uses.map(u=>{ let r; try{ r = String(safeCalc(u.input.expression)); }catch(e){ r='ERROR: '+e.message; }
      trace.steps.push({cls:'tool', k:`${UI.tool_call} · ${u.input.label||''}`, text:`${u.input.expression} = ${r}`}); return {type:'tool_result', tool_use_id:u.id, content:r}; });
    messages.push({role:'user', content:results});
  }
  if (!useSchema) return { text: final };
  let d; try{ d = parseJSON(final); }catch(e){ trace.steps.push({cls:'bad', k:LANG==='ko'?'스키마 검증 실패':'schema check failed', text: LANG==='ko'?'JSON을 찾지 못해 원문을 표시합니다':'No JSON found; showing raw text'}); return { text: final }; }
  const missing = ['A','B','C'].filter(n=>!(d.alternatives||[]).some(a=>a.name===n));
  trace.steps.push({cls: missing.length?'bad':'ok', k:LANG==='ko'?'스키마 검증':'schema check', text: missing.length ? `${LANG==='ko'?'누락된 대안':'missing alternatives'}: ${missing.join(', ')}` : (LANG==='ko'?'대안 A·B·C 모두 포함':'alternatives A, B, C all present')});
  const html = `<table><tr><th>${LANG==='ko'?'대안':'Alt.'}</th><th>${LANG==='ko'?'부족 수량':'Shortfall'}</th><th>${LANG==='ko'?'비용 항목':'Cost items'}</th><th>${LANG==='ko'?'총비용(원)':'Total (KRW)'}</th><th>${LANG==='ko'?'고객 납기':'Customer delivery'}</th><th>${LANG==='ko'?'리스크':'Risk'}</th></tr>` +
    (d.alternatives||[]).map(a=>`<tr><td><b>${esc(a.name)}</b></td><td>${esc(a.shortfall_units??'')}</td><td>${(a.cost_items||[]).map(c=>`${esc(c.item)}: ${esc(c.formula||'')} = ${Number(c.amount||0).toLocaleString()}`).join('<br>')}</td><td><b>${Number(a.total_cost||0).toLocaleString()}</b></td><td>${esc(a.customer_delivery||'')}</td><td>${esc(a.risk||'')}</td></tr>`).join('') + '</table>' +
    `<p><b>${LANG==='ko'?'추천':'Recommendation'}: ${esc(d.recommendation||'')}</b><br>${(d.reasons||[]).map(esc).join('<br>')}</p><p><b>${LANG==='ko'?'공급사 회신 요지':'Reply to supplier'}:</b> ${esc(d.reply_to_supplier||'')}</p>` +
    ((d.assumptions||[]).length ? `<p class="note">${LANG==='ko'?'가정':'Assumptions'}: ${(d.assumptions||[]).map(esc).join(' · ')}</p>` : '');
  return { html };
};

// ---------- boot ----------
(function(){
  const rail = $('#rail');
  TASKS.forEach(t=>{ const b=document.createElement('button'); b.className='tab'; b.role='tab'; b.dataset.id=t.id;
    b.innerHTML=`<span class="i">${t.icon}</span><span><span class="f">${esc(t.func)}</span>${esc(t.title)}</span>`; b.onclick=()=>render(t.id); rail.appendChild(b); });
  const k = store.get('apikey'); if(k) $('#apikey').value=k; $('#apikey').onchange = e => store.set('apikey', e.target.value.trim());
  const mdl = store.get('model'); if(mdl) $('#model').value=mdl; $('#model').onchange = e => store.set('model', e.target.value);
  const saved = store.get('task'); render(TASKS.some(t=>t.id===saved) ? saved : TASKS[0].id);
})();
</script>
